# ETL Pipeline Configuration
# PostgreSQL 14 settings for Ubuntu 22.04

[database]
# Основная база данных (целевая)
main_db_name = main_db
# Временная база данных (для сравнения)
temp_db_name = temp_db
# Пользователь PostgreSQL
db_user = postgres
# Хост PostgreSQL
db_host = localhost
# Порт PostgreSQL
db_port = 5432

[paths]
# Директория для входящих SQL-дампов
dumps_dir = /workspace/dumps
# Директория для логов
logs_dir = /workspace/logs
# Директория для временных файлов
temp_dir = /tmp/etl_temp

[logging]
# Уровень логирования: DEBUG, INFO, WARNING, ERROR
log_level = INFO
# Формат лога
log_format = %(asctime)s - %(levelname)s - %(message)s

[etl]
# Размер пакета для вставки строк (batch size)
batch_size = 1000
# Таймаут подключения к БД (секунды)
connection_timeout = 30
# Количество потоков для параллельной обработки (0 = отключено)
parallel_workers = 0
