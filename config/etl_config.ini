# ETL Pipeline Configuration
# PostgreSQL 14 settings for Ubuntu 22.04
# Replaces dump_restore.sh functionality with incremental updates

[database]
# Основная база данных (целевая) - из оригинального скрипта
db_name = masked
db_user = masked
db_host = localhost
db_port = 5432

# Временная база для сравнения (создается автоматически с префиксом + timestamp)
temp_db_prefix = temp_restore_

[paths]
# Директория для хранения бэкапов и дампов (из оригинального скрипта)
backup_storage_dir = /var/backups/postgres
# Директория для временных файлов
temp_dir = /tmp/pg_etl_temp
# Директория для логов
log_dir = /workspace/logs
# Файл лога
log_file = /workspace/logs/etl_pipeline.log
# CSV-файл для ручной загрузки asterisk_cdr (если таблица отсутствует в dump)
asterisk_csv_file = /workspace/logs/asterisk_cdr.csv
# CSV-файл для начальной загрузки group_employee_count, если таблица пуста
group_employee_count_csv_file = /workspace/logs/group_employee_count_backup.csv
# CSV-файл для начальной загрузки users_active, если таблица пуста
users_active_csv_file = /workspace/logs/users_active_backup.csv

[remote]
# Параметры удаленного сервера (из оригинального скрипта)
remote_user = masked
remote_host = masked
remote_path = masked
backup_tar = masked.tar.gz
backup_sql = masked.sql

[tables]
# Snapshot-таблицы, которые nightly выгружаются из staging и вливаются в main через UPSERT
# Формат: table_name:primary_key_column
# Для составных ключей используйте table_name:col1+col2
# ВАЖНО:
# - issues добавляется автоматически через параметр issues_table ниже
# - group_employee_count и users_active не указываются здесь, они являются ручными weekly-таблицами
incremental_tables = asterisk_cdr:id

# Таблицы которые полностью пересоздаются при каждом запуске (если есть)
full_restore_tables = 

# Таблица issues для трансформации custom values
# После transform попадает в snapshot-поток автоматически
issues_table = issues
# Таблица projects для трансформации custom values
# После transform попадает в snapshot-поток автоматически
projects_table = projects

[retention]
# Максимальное количество старых бэкапов для хранения (из оригинального скрипта)
max_backups = 3
# Очищать ли временную базу после завершения (true/false)
cleanup_temp_db = true

[schedule]
# День недели для еженедельных задач (1-понедельник, 7-воскресенье)
# Из оригинального скрипта: добавление строк в group_employee_count и users_active
target_day = 1
