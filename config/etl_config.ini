# ETL Pipeline Configuration
# PostgreSQL 14 settings for Ubuntu 22.04
# Replaces dump_restore.sh functionality with incremental updates

[database]
# Основная база данных (целевая) - из оригинального скрипта
db_name = masked
db_user = masked
db_host = localhost
db_port = 5432

# Временная база для сравнения (создается автоматически с префиксом + timestamp)
temp_db_prefix = temp_restore_

# Максимальное время одной snapshot-транзакции таблицы или REPLACE-группы.
# Большие таблицы (миллионы строк) могут обрабатываться дольше 30 минут.
snapshot_batch_timeout_seconds = 14400
# Отдельный предел ожидания блокировок main БД, чтобы не ждать их все 4 часа.
snapshot_lock_timeout_seconds = 300

[paths]
# Директория для хранения бэкапов и дампов (из оригинального скрипта)
backup_storage_dir = /var/backups/postgres
# Директория для двух предыдущих проверенных архивов.
# При max_backups=3 итог: 1 текущий в backup_storage_dir + 2 старых здесь.
old_backup_dir = /workspace/old_backup
# Директория для временных файлов
temp_dir = /tmp/pg_etl_temp
# Директория для логов
log_dir = /workspace/logs
# Файл лога
log_file = /workspace/logs/etl_pipeline.log
# CSV-файл для добавления новых строк asterisk_cdr напрямую в стабильную main БД
asterisk_csv_file = /workspace/logs/asterisk_cdr.csv
# CSV-файл используется только один раз при инициализации пустой group_employee_count
group_employee_count_csv_file = /workspace/logs/group_employee_count_backup.csv
# CSV-файл используется только один раз при инициализации пустой users_active
users_active_csv_file = /workspace/logs/users_active_backup.csv

[remote]
# Параметры удаленного сервера (из оригинального скрипта)
# Если все четыре параметра заполнены, nightly всегда скачивает новый архив.
# Существующий локальный путь из cron не отключает scp; для ручного файла нужен --local-dump.
remote_user = masked
remote_host = masked
remote_path = masked
backup_tar = masked.tar.gz
backup_sql = masked.sql

[tables]
# Автоматически находить все обычные таблицы public и вливать их в main через UPSERT.
# Для каждой таблицы используется PRIMARY KEY, а при его отсутствии простой UNIQUE index.
auto_discover_tables = true
# Останавливать pipeline, если найдена таблица без безопасного уникального ключа.
# Так таблица не будет молча пропущена. Ее нужно исправить либо явно исключить ниже.
fail_on_unkeyed_tables = true
# Дополнительные таблицы, которые осознанно не должны попадать в общий snapshot.
# asterisk_cdr, group_employee_count и users_active исключаются принудительно.
snapshot_excluded_tables =

# Таблицы без PRIMARY KEY/UNIQUE index, которые нужно точно зеркалировать из dump.
# Для них содержимое main заменяется атомарно только после успешной загрузки CSV.
# Порядок важен для связанных таблиц: родитель members загружается до member_roles;
# при очистке pipeline автоматически использует обратный порядок.
snapshot_replace_tables = members, member_roles, changeset_parents, custom_fields_db_types, custom_fields_hrm_user_types, custom_workflows_projects, global_note_templates_projects

# Явные таблицы/ключи. Используются как overrides к автообнаружению либо как полный
# список, если auto_discover_tables=false.
# Формат: table_name:primary_key_column
# Для составных ключей используйте table_name:col1+col2
# ВАЖНО:
# - при auto_discover_tables=true issues/projects обнаруживаются как остальные таблицы
# - issues и projects также добавляются автоматически через параметры ниже
# - asterisk_cdr, group_employee_count и users_active всегда исключаются из snapshot
# - asterisk_cdr дополняется из CSV по id, weekly-таблицы пополняются SQL-запросами в main
incremental_tables =

# Таблицы issues и projects автоматически входят в snapshot-поток.
# Колонки cf_* не переносятся, но pipeline не удаляет существующие столбцы из main.
issues_table = issues
projects_table = projects

[retention]
# Общее количество копий: текущий архив + старые архивы в old_backup_dir
max_backups = 3
# Очищать ли временную базу после завершения (true/false)
cleanup_temp_db = true

[schedule]
# Включить автоматическое пополнение group_employee_count и users_active
weekly_enabled = true
# Дни запуска по ISO (1-понедельник, 7-воскресенье), можно несколько: 1,4
weekly_days = 1
# Устаревший совместимый параметр: используется, только если weekly_days не указан
target_day = 1
# Шаблон группы для weekly-заполнения group_employee_count
# Оставьте реальное значение из prod-логики исходного скрипта
weekly_group_name_pattern = masked
